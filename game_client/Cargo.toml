[workspace]
members = ["pkg/framework/*", "pkg/shared", "pkg/mock_server"]

resolver = "2"
[workspace.dependencies]
bevy = { version = "0.17", features = ["bevy_dev_tools"] }
shared = { path = "./pkg/shared" }

[package]
name = "game_client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
shared = { workspace = true }

anima = { path = "./pkg/framework/anima" }
entity_message = { path = "./pkg/framework/entity_message" }
states_timer = { path = "./pkg/framework/states_timer" }

mock_server = { path = "./pkg/mock_server" }

bevy_dylib = "0.17"
bevy-inspector-egui = "0.34"
log = { version = "*", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
